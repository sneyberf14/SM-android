
name: Construir S M APK

on:
  workflow_dispatch:
  push:
    branches: ["principal"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto v0.7
        run: |
          ZIP="SM_Android_v0.7_fotos_texto_pantalla.zip"
          test -f "$ZIP"
          unzip -q "$ZIP" -d sm_project

      - name: Encontrar proyecto Gradle
        run: |
          SETTINGS_FILE=$(find sm_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No se encontro settings.gradle"
            find sm_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK
        run: gradle -p sm_project assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SM-APK-v0.7
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
