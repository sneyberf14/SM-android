
name: Construir S M APK

on:
  workflow_dispatch:
  push:
    branches: ["principal"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto v0.7
        run: |
          ZIP="SM_Android_v0.7_fotos_texto_pantalla.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No se encontro el ZIP"
            exit 1
          fi
          mkdir -p sm_project
          unzip -oq "$ZIP" -d sm_project

      - name: Encontrar configuracion Gradle
        run: |
          echo "Revisando archivos del proyecto..."
          find sm_project -maxdepth 6 -type f -print

          SETTINGS_FILE=$(find sm_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontro settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: No se encontro build.gradle"
            exit 1
          fi

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SM-APK-v0.7
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
